name: EZPep Planner private beta

on:
  workflow_dispatch:
  push:
    branches: [develop/0.4-multiplan]
    paths: [.github/workflows/private-beta-pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ezpep-private-beta-pages
  cancel-in-progress: false

jobs:
  build:
    # One activation push from the approved checkpoint; later pushes cannot deploy.
    if: >-
      github.repository == 'stonelynch99/peptide-planner-app' &&
      github.ref == 'refs/heads/develop/0.4-multiplan' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.before == '3c968bb7b48ac4935dc648f6ce25ef5d1ce6014a' &&
        github.event.head_commit.message == 'Deploy sync clarity and overdue logging repair'))
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c968bb7b48ac4935dc648f6ce25ef5d1ce6014a
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Require invite-gate configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Export protected web application
        working-directory: app
        run: npx expo export --platform web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy private beta
        id: deployment
        uses: actions/deploy-pages@v4
