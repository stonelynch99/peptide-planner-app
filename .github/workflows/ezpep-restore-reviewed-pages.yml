name: EZPep exact reviewed Pages restore
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Restore verified production bytes (false only prepares the artifact)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ezpep-private-beta-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'stonelynch99/peptide-planner-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact recovered artifact before use
        shell: python
        run: |
          import hashlib, io, json, pathlib, tarfile, zipfile
          root = pathlib.Path('.github/ezpep-rollback-2673b357')
          data = (root / 'rollback.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'e4f424370bbcead0b2e9ba8029e76aa54c714dc2363a7d93b127478db129d577'
          raw = (root / 'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '230b360bd3fda9de860f1bf4943d3f07508224794824d2e8b13ff53c9ff7860c'
          manifest = json.loads(raw)
          expected = {x['path']: x for x in manifest['files']}
          assert len(expected) == 17
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            assert z.namelist() == ['artifact.tar']
            with tarfile.open(fileobj=io.BytesIO(z.read('artifact.tar'))) as tar:
              seen = set()
              for member in tar.getmembers():
                assert not member.issym() and not member.islnk()
                if member.isdir(): continue
                name = member.name.removeprefix('./')
                assert member.isfile() and name in expected and name not in seen
                content = tar.extractfile(member).read()
                assert len(content) == expected[name]['bytes']
                assert hashlib.sha256(content).hexdigest() == expected[name]['sha256']
                output = pathlib.Path('verified-site') / name
                output.parent.mkdir(parents=True, exist_ok=True)
                output.write_bytes(content)
                seen.add(name)
              assert seen == set(expected)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: verified-site
          retention-days: 90
  deploy:
    if: inputs.deploy
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
